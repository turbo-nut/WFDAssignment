{%extends "wfdApp/base.html" %}


{%block content%}
<div class=title>
	<h3>Items</h3>
</div>
<table class="table">
<tr>
	<th>Name</th>
	<th>Category</th>
	<th>Description</th>
	<th>Price</th>
</tr>

	{% for i in itemlist %}
		<tr>
			<td>{{i.itemName}}</td>
			<td>{{i.category}}</td>
			<td>{{i.desc}}</td>
			<td>{{i.RetailPrice}}</td>

		</tr>
	{% endfor %}

	{%endblock content%}

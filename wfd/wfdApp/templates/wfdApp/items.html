<head>
	<title>Home</title>
	{#bootstrap 5 CDN#}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container fluid">
			<div class="navbar header">
				<a class="navbar-brand" href="wfdApp/">Stock Changer</a>
			</div>
			<ul class="navbar-nav">
			<li class="nav-item active">
				<a class="nav-link" href="/wfdApp/login">Login</a>
			</li>
			<li class="nav-item active">
				<a class="nav-link" href="/wfdApp/items">Items</a>
			</li>
			<li class="nav-item active">
				<a class="nav-link" href="/wfdApp/requests">Requests</a>
			</li>
			<li class="nav-item disabled">
					<a class="nav-link" href="/wfdApp/createItem">Create New Item</a>
			</li>
			<li class="nav-item disabled">
					<a class="nav-link" href="/wfdApp/createRequest">Create New Request</a>
			</li>
		</ul>
		<form class="form-inline my-2 my-lg-0" action="{%url 'item' %}" method="POST">
				{%csrf_token%}
				<input class="form control mr-sm-3" type="search" name="q" value="{{query}}" placeholder="Search" aria-label="Search">
			<button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search Item</button>
		</form>
	</div>
	</nav>
</head>
<body>
<table class="table">
<tr>
	<th>Name</th>
	<th>Category</th>
	<th>Stock</th>
	<th>Price</th>
</tr>

	{% for Item in itemlist%}
		<tr>
			<td>{{Item.ItemName}}</td>
			<td>{{Item.Category}}</td>
			<td>{{Item.Stock}}</td>
			<td>{{Item.RetailPrice}}</td>
			<td>
				<a class="btn btn-outline-secondary" href={%url 'itemDetails' Item.ItemID %}>
					<i class="bi bi-eye"></i>
				</a>
				<a class="btn btn-outline-secondary" href={%url 'editItem' Item.ItemID %}>
					<i class="bi bi-sliders2"></i>
				</a>

			</td>

		</tr>
	{% endfor %}
</div>
</body>
